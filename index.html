<title>Philosophy and Ethics, Christianity — A-level</title>
<style>
:root{
  --navy:#12294D; --navy2:#1B3A6B; --gold:#C9A227; --gold-soft:#E8D9A0;
  --parch:#FBF7EE; --parch2:#F3ECDD; --ink:#22201C; --muted:#6B6459;
  --rule:#DED3BC; --white:#fff;
  --phil:#33658A; --eth:#2F6B4F; --chri:#8E2430;
  --shadow:0 1px 2px rgba(18,41,77,.06),0 8px 24px rgba(18,41,77,.08);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--parch); color:var(--ink);
  font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif;
  font-size:17px; line-height:1.55; -webkit-font-smoothing:antialiased;
}
.wrap{max-width:1120px;margin:0 auto;padding:0 20px}
a{color:inherit}

/* ---------- header ---------- */
header.top{
  background:var(--navy);
  background-image:repeating-linear-gradient(180deg,rgba(255,255,255,.045) 0 1px,transparent 1px 26px);
  color:#F6F1E4; border-bottom:4px solid var(--gold);
  position:sticky; top:0; z-index:50;
}
.topbar{display:flex;align-items:center;gap:16px;padding:16px 0 6px}
.crest{width:52px;height:52px;flex:0 0 52px}
.brand{cursor:pointer}
.brand h1{margin:0;font-size:23px;letter-spacing:.01em;font-weight:600}
.brand p{margin:2px 0 0;font-size:13.5px;color:#C9D3E4;letter-spacing:.06em;text-transform:uppercase}
.searchrow{display:flex;gap:14px;align-items:center;padding:4px 0 18px;flex-wrap:wrap}
.searchrow input{
  font:inherit;font-size:15px;flex:1 1 240px;min-width:0;padding:9px 13px;border-radius:8px;
  border:1px solid rgba(233,217,160,.4);background:rgba(255,255,255,.08);color:#F6F1E4
}
.searchrow input::placeholder{color:#9DAAC0}
.searchrow input:focus{outline:2px solid var(--gold);outline-offset:1px}
.crumbs{display:flex;align-items:center;gap:8px;font-size:14px;color:#C9D3E4;flex-wrap:wrap}
.crumbs a{cursor:pointer;text-decoration:none;border-bottom:1px dotted rgba(233,217,160,.5)}
.crumbs a:hover{color:var(--gold-soft)}
.crumbs span.sep{opacity:.5}

/* ---------- generic ---------- */
main{padding:30px 0 70px;min-height:60vh}
h2.section{
  font-size:13px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);
  margin:0 0 14px;font-weight:600;display:flex;align-items:center;gap:12px
}
h2.section:after{content:"";flex:1;height:1px;background:var(--rule)}
.lede{font-size:18.5px;line-height:1.6;max-width:66ch;color:#3B382F;margin:0 0 26px}
.btn{
  display:inline-flex;align-items:center;gap:7px;font:inherit;font-size:14.5px;cursor:pointer;
  border-radius:7px;padding:8px 14px;text-decoration:none;border:1px solid var(--navy);
  background:var(--navy);color:#F6F1E4
}
.btn:hover{background:var(--navy2)}
.btn.ghost{background:transparent;color:var(--navy);border-color:#B9C3D4}
.btn.ghost:hover{background:#EDE6D6}

/* ---------- home: year cards ---------- */
.years{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:22px;margin-bottom:36px}
.yearcard{
  position:relative;background:var(--white);border:1px solid var(--rule);border-radius:14px;
  padding:26px 26px 22px;cursor:pointer;box-shadow:var(--shadow);transition:transform .12s,box-shadow .12s;
  text-align:left;font:inherit;color:inherit;width:100%
}
.yearcard:hover{transform:translateY(-2px);box-shadow:0 4px 10px rgba(18,41,77,.10),0 16px 34px rgba(18,41,77,.12)}
.yearcard:before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;border-radius:14px 0 0 14px;background:var(--gold)}
.yearcard.y13:before{background:var(--navy)}
.yearcard .yr{font-size:12.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.yearcard h3{margin:6px 0 4px;font-size:30px;font-weight:600;color:var(--navy)}
.yearcard .sub{color:#4A463D;margin:0 0 16px;font-size:16px}
.strandline{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.pill{
  font-size:13px;padding:4px 11px;border-radius:999px;border:1px solid var(--rule);
  background:var(--parch2);color:#4A463D;white-space:nowrap
}
.pill.p{border-color:#C6D5E3;background:#EAF1F7;color:var(--phil)}
.pill.e{border-color:#C3DACD;background:#E9F3EE;color:var(--eth)}
.pill.c{border-color:#E6C7CB;background:#F8EDEE;color:var(--chri)}
.yearcard .go{font-size:14.5px;color:var(--navy);font-weight:600}

/* ---------- strand cards ---------- */
.strands{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:20px}
.strandcard{
  background:var(--white);border:1px solid var(--rule);border-top:5px solid var(--acc,var(--navy));
  border-radius:12px;padding:22px;cursor:pointer;box-shadow:var(--shadow);text-align:left;font:inherit;
  color:inherit;width:100%;transition:transform .12s,box-shadow .12s
}
.strandcard:hover{transform:translateY(-2px);box-shadow:0 4px 10px rgba(18,41,77,.10),0 16px 30px rgba(18,41,77,.12)}
.strandcard h3{margin:0 0 6px;font-size:23px;color:var(--navy);font-weight:600}
.strandcard ol{margin:0 0 14px;padding-left:20px;font-size:15px;color:#413E36}
.strandcard ol li{margin:3px 0}
.count{font-size:14px;color:var(--acc);font-weight:600}

/* ---------- unit cards ---------- */
.units{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:20px;align-items:start}
.unit{
  background:var(--white);border:1px solid var(--rule);border-radius:12px;overflow:hidden;
  box-shadow:var(--shadow);display:flex;flex-direction:column;transition:transform .12s,box-shadow .12s
}
.unit:hover{transform:translateY(-2px);box-shadow:0 4px 10px rgba(18,41,77,.10),0 16px 30px rgba(18,41,77,.12)}
.unit .bar{height:5px;background:var(--acc)}
.unit .body{padding:20px 20px 0;flex:1;cursor:pointer}
.unit .no{font-size:12.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--acc);font-weight:600}
.unit h3{margin:5px 0 8px;font-size:21px;line-height:1.25;color:var(--navy);font-weight:600}
.bq{margin:0 0 14px;font-size:16px;color:#413E36;font-style:italic;border-left:3px solid var(--gold-soft);padding-left:11px}
.subs{list-style:none;margin:0 0 14px;padding:0}
.subs li{font-size:14.5px;padding:5px 0 5px 20px;position:relative;border-bottom:1px dotted var(--rule);color:#413E36}
.subs li:last-child{border-bottom:0}
.subs li:before{content:"";position:absolute;left:4px;top:12px;width:6px;height:6px;border-radius:50%;background:var(--acc);opacity:.55}
.unit .acts{display:flex;gap:10px;flex-wrap:wrap;padding:0 20px 18px;align-items:center}
.linkcopy{font:inherit;font-size:12.5px;border:0;background:transparent;color:var(--muted);cursor:pointer;padding:4px;text-decoration:underline dotted}
.linkcopy:hover{color:var(--navy)}

/* ---------- stats ---------- */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin:0 0 34px}
.stat{background:var(--white);border:1px solid var(--rule);border-radius:10px;padding:14px 16px;text-align:center}
.stat b{display:block;font-size:29px;color:var(--navy);font-weight:600;line-height:1.1}
.stat span{font-size:12.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}

/* ---------- arcade ---------- */
.arcadelink{
  display:inline-flex;align-items:center;gap:7px;font-size:13.5px;letter-spacing:.04em;text-decoration:none;
  border:1px solid rgba(233,217,160,.55);border-radius:999px;padding:7px 13px;color:#F6F1E4;background:rgba(201,162,39,.16);white-space:nowrap
}
.arcadelink:hover{background:rgba(201,162,39,.32)}
.arcadelink svg{width:15px;height:15px}
.arcade{
  position:relative;display:grid;grid-template-columns:1fr auto;gap:22px;align-items:center;
  background:var(--navy);background-image:repeating-linear-gradient(180deg,rgba(255,255,255,.045) 0 1px,transparent 1px 26px);
  color:#F6F1E4;border:1px solid var(--navy2);border-radius:14px;padding:26px 28px;margin:0 0 36px;
  box-shadow:var(--shadow);cursor:pointer;text-align:left;font:inherit;width:100%;transition:transform .12s,box-shadow .12s
}
.arcade:hover{transform:translateY(-2px);box-shadow:0 4px 10px rgba(18,41,77,.18),0 16px 34px rgba(18,41,77,.22)}
.arcade:before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;border-radius:14px 0 0 14px;background:var(--gold)}
.arcade .yr{font-size:12.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold-soft)}
.arcade h3{margin:6px 0 6px;font-size:28px;font-weight:600;color:#fff}
.arcade .sub{margin:0 0 14px;font-size:16px;color:#D8DEEA;max-width:62ch}
.arcade .games{display:flex;gap:8px;flex-wrap:wrap}
.arcade .games span{font-size:13px;padding:4px 11px;border-radius:999px;border:1px solid rgba(233,217,160,.4);background:rgba(255,255,255,.07);color:#F6F1E4;white-space:nowrap}
.arcade .games span b{color:var(--gold-soft);font-weight:600}
.arcade .go{font-size:15px;color:var(--navy);font-weight:600;background:var(--gold);border-radius:8px;padding:11px 18px;white-space:nowrap}
.arcades{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:20px;margin:0 0 36px}
.arcades .arcade{grid-template-columns:1fr;align-items:start;margin:0;gap:14px}
.arcades .arcade .go{justify-self:start}
.arcade.a2{background:#123F4D}
.arcade.a2:before{background:#5FD3BE}
.arcade.a2 .yr{color:#9BE7D8}
.arcade.a2 .go{background:#5FD3BE;color:#0B2F3A}
@media(max-width:640px){.arcade{grid-template-columns:1fr}.arcade .go{justify-self:start}}

/* ---------- in-page unit viewer ---------- */
body.viewing main{padding:0}
body.viewing .wrap.viewwrap{max-width:none;padding:0}
.unitbar{
  display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  background:var(--parch2);border-bottom:1px solid var(--rule);padding:10px 20px
}
.unitbar .back{
  font:inherit;font-size:14.5px;cursor:pointer;border:1px solid #B9C3D4;background:var(--white);
  color:var(--navy);border-radius:7px;padding:7px 13px
}
.unitbar .back:hover{background:#EDE6D6}
.unitbar .now{font-size:15.5px;color:var(--navy);font-weight:600}
.unitbar .ctx{font-size:13.5px;color:var(--muted)}
.unitbar .nav{margin-left:auto;display:flex;gap:8px}
.unitbar .nav button{
  font:inherit;font-size:13.5px;cursor:pointer;border:1px solid #B9C3D4;background:var(--white);
  color:var(--navy);border-radius:7px;padding:6px 11px
}
.unitbar .nav button:disabled{opacity:.35;cursor:default}
.unitbar .nav button:not(:disabled):hover{background:#EDE6D6}
#frame{display:block;width:100%;border:0;background:var(--parch)}
.loading{padding:40px 20px;text-align:center;color:var(--muted);font-size:15px}
footer{border-top:1px solid var(--rule);padding:22px 0 40px;font-size:13.5px;color:var(--muted)}
body.viewing footer{display:none}
@media(max-width:640px){
  body{font-size:16px}
  .brand h1{font-size:19px}
  .yearcard h3{font-size:25px}
  .unitbar{gap:10px;padding:9px 14px}
  .unitbar .nav{margin-left:0;width:100%}
}
</style>

/* ============================================================
   3. RENDERING
   ============================================================ */
var view   = document.getElementById("view");
var crumbs = document.getElementById("crumbs");
var qbox   = document.getElementById("q");

function el(tag, cls, txt){ var e=document.createElement(tag); if(cls) e.className=cls; if(txt!=null) e.textContent=txt; return e; }
function findYear(k){ for(var i=0;i<COURSE.length;i++) if(COURSE[i].key===k) return COURSE[i]; return null; }
function findStrand(y,k){ for(var i=0;i<y.strands.length;i++) if(y.strands[i].key===k) return y.strands[i]; return null; }
function findUnit(s,n){ for(var i=0;i<s.units.length;i++) if(String(s.units[i].n)===String(n)) return s.units[i]; return null; }
function allUnits(){
  var out=[];
  COURSE.forEach(function(y){ y.strands.forEach(function(s){ s.units.forEach(function(u){ out.push({y:y,s:s,u:u}); }); }); });
  return out;
}
/* the file this unit's page lives in, inside PAGES_BASE */
function pageName(y,s,u){
  var slug = u.t.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
  return y.key + "-" + s.key + "-" + u.n + "-" + slug + ".html";
}
function go(hash){ location.hash = hash; }

function setCrumbs(parts){
  crumbs.innerHTML="";
  parts.forEach(function(p,i){
    if(i) crumbs.appendChild(el("span","sep","›"));
    if(p.hash!=null){ var a=el("a",null,p.label); a.href="#"+p.hash; crumbs.appendChild(a); }
    else crumbs.appendChild(el("span",null,p.label));
  });
}
function leaveViewer(){
  document.body.classList.remove("viewing");
  view.className = "wrap";
}

/* ---- unit card ---- */
function unitCard(y,s,u,withContext){
  var card = el("div","unit");
  card.style.setProperty("--acc", s.accent);
  card.appendChild(el("div","bar"));
  var b = el("div","body");
  b.onclick=function(){ go("#/"+y.key+"/"+s.key+"/"+u.n); };
  if(withContext){
    var ctx = el("div","no", y.title + " · " + s.name);
    ctx.style.color="var(--muted)";
    b.appendChild(ctx);
  }
  b.appendChild(el("div","no", "Unit " + u.n));
  b.appendChild(el("h3", null, u.t));
  b.appendChild(el("p","bq", u.bq));
  var ul = el("ul","subs");
  u.subs.forEach(function(x){ ul.appendChild(el("li",null,x)); });
  b.appendChild(ul);
  card.appendChild(b);

  var acts = el("div","acts");
  var open = el("button","btn","Open unit");
  open.type="button";
  open.onclick=function(){ go("#/"+y.key+"/"+s.key+"/"+u.n); };
  acts.appendChild(open);

  var cp = el("button","linkcopy","Copy link");
  cp.type="button";
  cp.onclick=function(ev){
    ev.stopPropagation();
    var url = location.href.split("#")[0] + "#/" + y.key + "/" + s.key + "/" + u.n;
    try{
      navigator.clipboard.writeText(url).then(
        function(){ cp.textContent="Link copied"; setTimeout(function(){cp.textContent="Copy link";},1600); },
        function(){ cp.textContent=url; });
    }catch(e){ cp.textContent=url; }
  };
  acts.appendChild(cp);
  card.appendChild(acts);
  return card;
}

/* ---- home ---- */
function renderHome(){
  leaveViewer();
  setCrumbs([{label:"Course home"}]);
  view.innerHTML="";
  view.appendChild(el("p","lede","Everything for A-level Philosophy, Ethics and Christianity in one place. Start with your year, choose Philosophy, Ethics or Christianity, then open the unit you are studying — it opens right here."));

  var n=0; allUnits().forEach(function(){ n++; });
  var stats = el("div","stats");
  [[2,"years"],[6,"strands"],[n,"units"],[2,"arcades"]].forEach(function(p){
    var st=el("div","stat"); st.appendChild(el("b",null,String(p[0]))); st.appendChild(el("span",null,p[1])); stats.appendChild(st);
  });
  view.appendChild(stats);

  view.appendChild(el("h2","section","Choose a year"));
  var years = el("div","years");
  COURSE.forEach(function(y){
    var c = el("button","yearcard" + (y.key==="y13" ? " y13":""));
    c.type="button";
    c.appendChild(el("div","yr", y.key==="y12" ? "First year of the A-level" : "Second year of the A-level"));
    c.appendChild(el("h3",null,y.title));
    c.appendChild(el("p","sub", y.sub));
    var line = el("div","strandline");
    y.strands.forEach(function(s){ line.appendChild(el("span","pill "+s.cls, s.name + " · " + s.units.length + " units")); });
    c.appendChild(line);
    c.appendChild(el("div","go","Open " + y.title + " →"));
    c.onclick=function(){ go("#/"+y.key); };
    years.appendChild(c);
  });
  view.appendChild(years);

  view.appendChild(el("h2","section","Revise with the arcade"));
  view.appendChild(arcadeCards());
}

/* ---- the two arcades ---- */
var ARCADES = [
 { id:"alevel", file:"arcade.html", cls:"",
   kicker:"Philosophers' Arcade \u00b7 A-level, AQA 7062",
   title:"Philosophy, Ethics and Christianity",
   blurb:"Every term, scholar and argument from the 25 units above \u2014 Paley and Hume, agape and eudaimonia, Hampson and Ruether.",
   games:["Key Term","Sort Sixteen","Concept Drop","Knock-out"] },
 { id:"gcse", file:"arcade-gcse.html", cls:"a2",
   kicker:"Believers' Arcade \u00b7 GCSE, Edexcel B",
   title:"Christianity and Islam at GCSE",
   blurb:"All eight GCSE units \u2014 Paper 1 Christianity and Paper 2 Islam \u2014 for Year 10 and Year 11, and for teaching lower down.",
   games:["Key Term","Sort Sixteen","Concept Drop","Knock-out"] }
];
function findArcade(id){ for(var i=0;i<ARCADES.length;i++) if(ARCADES[i].id===id) return ARCADES[i]; return null; }

/* ---- arcade cards (home + search) ---- */
function arcadeCards(){
  var g = el("div","arcades");
  ARCADES.forEach(function(a){ g.appendChild(arcadeCard(a)); });
  return g;
}
function arcadeCard(a){
  var c = el("button","arcade" + (a.cls ? " "+a.cls : "")); c.type="button";
  var left = el("div");
  left.appendChild(el("div","yr", a.kicker));
  left.appendChild(el("h3",null,a.title));
  left.appendChild(el("p","sub", a.blurb));
  var g = el("div","games");
  a.games.forEach(function(n){ var sp = el("span"); sp.appendChild(el("b",null,n)); g.appendChild(sp); });
  left.appendChild(g);
  c.appendChild(left);
  c.appendChild(el("div","go","Open the arcade →"));
  c.onclick=function(){ go("#/arcade/"+a.id); };
  return c;
}

/* ---- arcade viewer (opens inside this page, like a unit) ---- */
function renderArcadeIndex(){
  leaveViewer();
  setCrumbs([{label:"Course home",hash:"/"},{label:"The arcade"}]);
  view.innerHTML="";
  view.appendChild(el("p","lede","Two arcades, the same four games. The A-level one is built on the 25 units above; the GCSE one covers all eight Edexcel B units for Years 10 and 11."));
  view.appendChild(arcadeCards());
}
function renderArcade(a){
  setCrumbs([{label:"Course home",hash:"/"},{label:"The arcade",hash:"/arcade"},{label:a.title}]);
  document.body.classList.add("viewing");
  view.className = "wrap viewwrap";
  view.innerHTML="";
  var bar = el("div","unitbar");
  var back = el("button","back","← Course home"); back.type="button"; back.onclick=function(){ go("#/"); };
  bar.appendChild(back);
  var now = el("div");
  now.appendChild(el("div","now", a.kicker));
  now.appendChild(el("div","ctx","Key Term · Sort Sixteen · Concept Drop · Knock-out"));
  bar.appendChild(now);
  var other = ARCADES.filter(function(x){ return x.id!==a.id; })[0];
  if(other){ var nav = el("div","nav"); var sw = el("button",null,"Switch to " + (other.id==="gcse" ? "GCSE" : "A-level") + " ›"); sw.type="button";
    sw.onclick=function(){ go("#/arcade/"+other.id); }; nav.appendChild(sw); bar.appendChild(nav); }
  view.appendChild(bar);
  var note = el("div","loading","Opening the arcade…");
  view.appendChild(note);
  frame = document.createElement("iframe");
  frame.id = "frame"; frame.title = a.title; frame.src = a.file;
  frame.onload = function(){ if(note.parentNode) note.parentNode.removeChild(note); sizeFrame(); };
  view.appendChild(frame);
  window.scrollTo(0,0); sizeFrame(); setTimeout(sizeFrame,120);
}

/* ---- year ---- */
function renderYear(y){
  leaveViewer();
  setCrumbs([{label:"Course home",hash:"/"},{label:y.title}]);
  view.innerHTML="";
  view.appendChild(el("p","lede", y.sub));
  view.appendChild(el("h2","section","Choose a strand"));
  var g = el("div","strands");
  y.strands.forEach(function(s){
    var c = el("button","strandcard"); c.type="button"; c.style.setProperty("--acc", s.accent);
    c.appendChild(el("h3",null,s.name));
    var ol = el("ol");
    s.units.forEach(function(u){ ol.appendChild(el("li",null,u.t)); });
    c.appendChild(ol);
    c.appendChild(el("div","count", s.units.length + " units →"));
    c.onclick=function(){ go("#/"+y.key+"/"+s.key); };
    g.appendChild(c);
  });
  view.appendChild(g);
}

/* ---- strand ---- */
function renderStrand(y,s){
  leaveViewer();
  setCrumbs([{label:"Course home",hash:"/"},{label:y.title,hash:"/"+y.key},{label:s.name}]);
  view.innerHTML="";
  var lede = el("p","lede", y.title + " · " + s.name + " — " + s.units.length + " units, taught in this order.");
  view.appendChild(lede);
  var g = el("div","units");
  s.units.forEach(function(u){ g.appendChild(unitCard(y,s,u,false)); });
  view.appendChild(g);
}

/* ---- unit viewer (the unit page opens inside this page) ---- */
var frame = null;
function sizeFrame(){
  if(!frame) return;
  var top = frame.getBoundingClientRect().top + window.scrollY;
  frame.style.height = Math.max(420, window.innerHeight - frame.getBoundingClientRect().top) + "px";
}
window.addEventListener("resize", sizeFrame);

function renderUnit(y,s,u){
  setCrumbs([{label:"Course home",hash:"/"},{label:y.title,hash:"/"+y.key},
             {label:s.name,hash:"/"+y.key+"/"+s.key},{label:u.t}]);
  document.body.classList.add("viewing");
  view.className = "wrap viewwrap";
  view.innerHTML="";

  var bar = el("div","unitbar");
  var back = el("button","back","← All " + s.name + " units");
  back.type="button";
  back.onclick=function(){ go("#/"+y.key+"/"+s.key); };
  bar.appendChild(back);
  var now = el("div");
  now.appendChild(el("div","now","Unit " + u.n + " · " + u.t));
  now.appendChild(el("div","ctx", y.title + " · " + s.name));
  bar.appendChild(now);

  var idx = s.units.indexOf(u);
  var nav = el("div","nav");
  var prev = el("button",null,"‹ Previous unit"); prev.type="button";
  var next = el("button",null,"Next unit ›"); next.type="button";
  prev.disabled = idx<=0;
  next.disabled = idx>=s.units.length-1;
  prev.onclick=function(){ if(idx>0) go("#/"+y.key+"/"+s.key+"/"+s.units[idx-1].n); };
  next.onclick=function(){ if(idx<s.units.length-1) go("#/"+y.key+"/"+s.key+"/"+s.units[idx+1].n); };
  nav.appendChild(prev); nav.appendChild(next);
  bar.appendChild(nav);
  view.appendChild(bar);

  var note = el("div","loading","Opening " + u.t + "…");
  view.appendChild(note);

  frame = document.createElement("iframe");
  frame.id = "frame";
  frame.title = u.t;
  frame.src = PAGES_BASE + pageName(y,s,u);
  frame.onload = function(){ if(note.parentNode) note.parentNode.removeChild(note); sizeFrame(); };
  frame.onerror = function(){ note.textContent = "That unit page could not be found — check units/" + pageName(y,s,u); };
  view.appendChild(frame);
  window.scrollTo(0,0);
  sizeFrame();
  setTimeout(sizeFrame,120);
}

/* ---- search ---- */
function renderSearch(term){
  leaveViewer();
  setCrumbs([{label:"Course home",hash:"/"},{label:'Search: "'+term+'"'}]);
  view.innerHTML="";
  var t = term.toLowerCase();
  var hits = allUnits().filter(function(x){
    var hay = (x.u.t+" "+x.u.bq+" "+x.u.subs.join(" ")+" "+x.s.name+" "+x.y.title).toLowerCase();
    return hay.indexOf(t) > -1;
  });
  view.appendChild(el("p","lede", hits.length
      ? hits.length + (hits.length===1?" unit matches ":" units match ") + '"'+term+'".'
      : 'Nothing matches "'+term+'". Try a philosopher, a key word, or a unit name.'));
  if(/arcade|game|wordle|quiz|revis|play|gcse/.test(t)) view.appendChild(arcadeCards());
  var g = el("div","units");
  hits.forEach(function(x){ g.appendChild(unitCard(x.y,x.s,x.u,true)); });
  view.appendChild(g);
}

/* ---- router ---- */
function route(){
  var h = (location.hash||"#/").replace(/^#\/?/,"");
  var parts = h.split("/").filter(Boolean);
  if(parts[0]==="search"){ renderSearch(decodeURIComponent(parts.slice(1).join("/"))); return; }
  if(parts[0]==="arcade"){
    var a = parts[1] ? findArcade(parts[1]) : null;
    if(a) renderArcade(a); else renderArcadeIndex();
    window.scrollTo(0,0); return;
  }
  if(!parts.length){ if(qbox.value) qbox.value=""; renderHome(); window.scrollTo(0,0); return; }
  var y = findYear(parts[0]);
  if(!y){ renderHome(); return; }
  if(parts.length===1){ renderYear(y); window.scrollTo(0,0); return; }
  var s = findStrand(y,parts[1]);
  if(!s){ renderYear(y); return; }
  if(parts.length===2){ renderStrand(y,s); window.scrollTo(0,0); return; }
  var u = findUnit(s,parts[2]);
  if(!u){ renderStrand(y,s); return; }
  renderUnit(y,s,u);
}
window.addEventListener("hashchange", route);
document.getElementById("brand").onclick=function(){ go("#/"); };

/* ---- search box ---- */
var tmr=null;
qbox.addEventListener("input", function(){
  clearTimeout(tmr);
  tmr=setTimeout(function(){
    var v=qbox.value.trim();
    if(v.length<2){ if((location.hash||"").indexOf("#/search")===0) go("#/"); return; }
    go("#/search/" + encodeURIComponent(v));
  }, 220);
});

route();
